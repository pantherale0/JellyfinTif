name: Release

on:
  push:
    tags:
      - v*

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"
  TAG_NAME: ${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK signatures
        run: |
          find app/build/outputs/apk -name '*.apk' -print0 |
            xargs -0 -n1 "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose --print-certs

      - name: Copy APKs to short names
        run: |
          find app/build/outputs/apk/release -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              abi=$(basename "$apk" | sed -E 's/.*-(armeabi-v7a|arm64-v8a|x86|x86_64|universal)\.apk/\1/')
              short_name="JellyfinTif-${TAG_NAME}-${abi}.apk"
              cp "$apk" "$short_name"
              echo "$apk => $short_name"
            done

      - name: Checksums
        run: |
          echo "SHA256 checksums:"
          { find app/build/outputs/apk -name '*.apk'; find . -maxdepth 1 -name 'JellyfinTif-*.apk'; } | sort -u | xargs sha256sum

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ env.TAG_NAME }}
          path: app/build/outputs/**/mapping.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s globstar nullglob
          apks=(app/build/outputs/apk/**/*.apk JellyfinTif-*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found"
            exit 1
          fi

          gh release create "$TAG_NAME" \
            --latest \
            --title "$TAG_NAME" \
            --verify-tag \
            --generate-notes \
            "${apks[@]}"
