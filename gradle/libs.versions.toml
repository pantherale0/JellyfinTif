okhttpBom = "5.3.2"
kotlinxCoroutinesTest = "1.11.0"
junit = "4.13.2"
wholphin-extensions = "0.1.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
